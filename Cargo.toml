[package]
name = "rigging"
description = "An asynchronous TUI framework for Rust designed to create reactive inline terminal interfaces."
keywords = ["tui", "ui", "terminal", "interface", "framework"]
categories = ["development-tools"]
version = "0.1.4"
license = "MIT"
authors = ["Bulat Sh. <synapdrake@ya.ru>"]
repository = "https://github.com/fuderis/rigging-rs"
readme = "README.md"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.91"
strip-ansi-escapes = "0.2.1"
unicode-width = "0.2.2"

markdown = { version = "1.0.0", optional = true }

tree-sitter = { version = "0.26", optional = true }
tree-sitter-highlight = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-bash = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-json = { version = "0.23", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
adot-tree-sitter-toml = { version = "0.1.0", optional = true }

[features]
full = ["markdown", "highlight"]
markdown = ["dep:markdown"]
highlight = [
  "dep:tree-sitter", "dep:tree-sitter-highlight", "dep:tree-sitter-rust", "dep:tree-sitter-bash",
  "dep:tree-sitter-python", "dep:tree-sitter-javascript", "dep:tree-sitter-typescript", "dep:tree-sitter-go",
  "dep:tree-sitter-json", "dep:tree-sitter-yaml", "dep:adot-tree-sitter-toml"
]
